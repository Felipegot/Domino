<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101311">
<title>Catálogo Dominó — Reglas y Marcador</title>
<style>
:root{
  color-scheme:dark;
  --bg:#101311; --surface:#171c19; --surface-raised:#202823; --line:#303a33;
  --txt:#f3f5ef; --muted:#a2ada4;
  --accent:#d6bd8b; --accent-ink:#211d14; --green:#b6c4a4; --red:#d98b7f;
  --glow:rgba(214,189,139,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% -18%,#29332a 0,transparent 48%),var(--bg);color:var(--txt);font-family:Inter,'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
.view{display:none;padding:24px 20px 56px;max-width:900px;margin:0 auto;animation:fade .28s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:14px;margin:-24px -20px 30px;padding:14px 20px;background:rgba(16,19,17,.88);position:sticky;top:0;z-index:10;backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}
.topbar strong{font-size:.95rem;letter-spacing:.01em}
.hero{position:relative;overflow:hidden;padding:38px 36px;margin:20px 0 30px;border:1px solid #3a463a;border-radius:26px;background:linear-gradient(120deg,rgba(217,243,106,.12),transparent 52%),linear-gradient(145deg,#222c24,#171d19 68%);box-shadow:0 24px 70px rgba(0,0,0,.2)}
.hero:after{content:"";position:absolute;width:220px;height:220px;right:-45px;top:-78px;border:1px solid rgba(217,243,106,.16);border-radius:50%;box-shadow:0 0 0 24px rgba(217,243,106,.025),0 0 0 48px rgba(217,243,106,.02)}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:.73rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.eyebrow:before{content:"";width:20px;height:2px;background:var(--accent);border-radius:2px}
h1.app{font-size:clamp(2rem,6vw,3.35rem);line-height:1.04;margin:16px 0 10px;letter-spacing:-.055em}
.sub{color:var(--muted);font-size:.96rem;line-height:1.6;max-width:540px}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 2px 14px}
.section-heading h2{font-size:1.05rem;letter-spacing:-.02em}
.section-heading span{color:var(--muted);font-size:.78rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{--game-accent:var(--accent);--game-wash:var(--glow);appearance:none;text-align:left;font:inherit;color:inherit;width:100%;min-height:190px;position:relative;overflow:hidden;background:linear-gradient(145deg,var(--game-wash),transparent 68%),linear-gradient(145deg,#202721,#171c19 72%);border:1px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.card:before{content:"";position:absolute;right:-28px;top:-39px;width:108px;height:108px;border:1px solid color-mix(in srgb,var(--game-accent) 25%,transparent);border-radius:50%;box-shadow:0 0 0 14px var(--game-wash)}
.card:hover{transform:translateY(-3px);border-color:var(--game-accent);box-shadow:0 12px 32px rgba(0,0,0,.2),0 0 28px var(--game-wash)}
.card:active{transform:scale(.985)}
.card .num{color:var(--game-accent);font-size:.67rem;font-weight:800;letter-spacing:.14em}
.card h3{font-size:1.03rem;line-height:1.3;letter-spacing:-.015em;flex:1;max-width:86%}
.game-art{position:absolute;right:15px;top:35px;font-size:3.05rem;line-height:1;filter:drop-shadow(0 5px 10px rgba(0,0,0,.35));transform:rotate(7deg);transition:transform .2s}
.card:hover .game-art{transform:rotate(0) scale(1.12)}
.game-hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;overflow:hidden;min-height:190px;padding:30px 32px;margin:6px 0 20px;border:1px solid color-mix(in srgb,var(--game-accent) 35%,transparent);border-radius:22px;background:radial-gradient(ellipse at 86% 50%,var(--game-wash),transparent 46%),linear-gradient(145deg,#202721,#171c19 72%)}
.game-hero:before,.game-hero:after{content:"";position:absolute;right:6%;top:50%;width:145px;height:145px;border:1px solid color-mix(in srgb,var(--game-accent) 20%,transparent);border-radius:50%;transform:translateY(-50%)}
.game-hero:after{width:190px;height:190px;right:3%;opacity:.45}
.game-hero-copy{position:relative;z-index:1;max-width:72%}
.game-kicker{display:inline-flex;align-items:center;gap:7px;color:var(--game-accent);font-size:.7rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.game-kicker:before{content:"";width:17px;height:2px;border-radius:2px;background:currentColor}
.game-hero h2.title{margin:0 0 8px}
.game-hero .meta{margin:0}
.game-hero .meta b,.game-hero .title{color:var(--game-accent)}
.game-art-large{position:relative;z-index:1;flex:0 0 auto;display:grid;place-items:center;width:120px;height:120px;border:1px solid color-mix(in srgb,var(--game-accent) 28%,transparent);border-radius:34px;background:linear-gradient(145deg,var(--game-wash),rgba(255,255,255,.025));box-shadow:0 18px 45px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.08);font-size:4.5rem;transform:rotate(5deg);animation:float .9s ease-out both}
@keyframes float{from{opacity:0;transform:translateY(9px) rotate(5deg) scale(.92)}to{opacity:1;transform:translateY(0) rotate(5deg) scale(1)}}
.game-themed{--game-accent:var(--accent);--game-wash:var(--glow)}
.game-themed .rules h3{color:var(--game-accent)}
.game-themed .rules li::marker{color:var(--game-accent)}
.game-themed .btn.primary{background:var(--game-accent);color:#171a13;box-shadow:0 8px 26px var(--game-wash)}
.game-score-title{display:flex;align-items:center;gap:10px;min-width:0}
.score-game-icon{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:var(--game-wash);font-size:1.2rem}
#v-score[data-game]{--game-accent:var(--accent);--game-wash:var(--glow)}
#v-score[data-game] .topbar{border-bottom-color:color-mix(in srgb,var(--game-accent) 28%,transparent)}
#v-score[data-game] .topbar strong{color:var(--game-accent)}
#v-score[data-game] .btn.green{background:var(--game-accent);color:#171a13}
#v-score[data-game] .set.on{background:var(--game-wash);border-color:var(--game-accent);color:var(--game-accent)}
.chip{display:inline-block;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.055);border-radius:999px;padding:5px 9px;font-size:.69rem;color:var(--muted);white-space:normal}
.live{background:rgba(185,237,145,.13);color:var(--green);border:1px solid rgba(185,237,145,.28);border-radius:999px;padding:4px 9px;font-size:.65rem;font-weight:800;width:fit-content}
h2.title{font-size:clamp(1.5rem,5vw,2rem);letter-spacing:-.04em;margin:8px 0 8px}
.meta{color:var(--muted);font-size:.86rem;line-height:1.7;margin-bottom:18px}
.meta b{color:var(--accent)}
.rules{background:linear-gradient(145deg,rgba(255,255,255,.035),transparent 42%),var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,30px);margin-bottom:20px}
.rules h3{font-size:.97rem;color:var(--accent);margin:22px 0 9px}
.rules h3:first-child{margin-top:0}
.rules p,.rules li{font-size:.93rem;line-height:1.7;color:var(--txt)}
.rules ul{padding-left:21px;display:flex;flex-direction:column;gap:9px}
.rules li::marker{color:var(--accent)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font:inherit;font-size:.98rem;font-weight:800;cursor:pointer;min-height:54px;transition:transform .15s,filter .15s,background .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px var(--glow)}
.btn.green{background:var(--green);color:#15200f}
.btn.red{background:#572d2c;color:#ffd9d5;border:1px solid rgba(240,120,112,.25)}
.btn.ghost{background:var(--surface-raised);color:var(--txt);border:1px solid var(--line)}
.sets{display:flex;gap:10px;margin:4px 0 18px}
.set{appearance:none;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;font:inherit;font-weight:750;color:var(--muted);min-height:50px;transition:background .15s,border-color .15s,color .15s}
.set:hover:not(.off){border-color:rgba(217,243,106,.45)}
.set.on{background:rgba(217,243,106,.1);border-color:var(--accent);color:var(--accent)}
.set.off{opacity:.35;cursor:not-allowed}
.roundinfo{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-bottom:10px;padding:0 2px}
.prow{display:grid;grid-template-columns:36px minmax(0,1fr) 76px 58px 40px;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:9px;transition:border-color .15s}
.prow.first{border-color:rgba(217,243,106,.38);background:linear-gradient(100deg,rgba(217,243,106,.07),transparent 65%),var(--surface)}
.rank{width:34px;height:34px;border-radius:11px;background:var(--surface-raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem}
.prow.first .rank{background:var(--accent);color:#140f00;border-color:var(--accent)}
.pname{font-weight:650;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rinp{width:100%;background:#111613;border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;font-size:1rem;font-weight:750;text-align:center;padding:9px 4px;min-height:46px}
.rinp:focus,.addrow input:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.ptotal{text-align:center;font-weight:850;font-size:1.05rem;font-variant-numeric:tabular-nums}
.idel{background:transparent;border:1px solid transparent;border-radius:10px;color:var(--muted);font-size:1rem;cursor:pointer;padding:8px;min-height:40px}
.idel:hover{background:rgba(240,120,112,.1);color:var(--red)}
.joinnote{background:rgba(217,243,106,.06);border:1px dashed rgba(217,243,106,.3);border-radius:12px;padding:11px 13px;font-size:.78rem;color:var(--muted);margin-bottom:12px;line-height:1.55}
.addrow{display:flex;gap:10px;margin-bottom:16px}
.addrow input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px 14px;font:inherit;font-size:.94rem;min-height:50px}
.addrow input::placeholder{color:#7e8980}
.addbtn{width:54px;flex:0 0 54px;background:var(--accent);border:none;border-radius:12px;font-size:1.55rem;color:var(--accent-ink);font-weight:700;cursor:pointer;transition:transform .15s}
.addbtn:hover{transform:translateY(-1px)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.hist{color:var(--muted);font-size:.75rem;text-align:center;margin-top:14px;line-height:1.5}
.empty{color:var(--muted);text-align:center;padding:32px 16px;font-size:.88rem;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(min-width:700px){.actions{display:grid;grid-template-columns:1.25fr 1fr 1fr}.actions .btn{font-size:.84rem;padding:14px 10px}}
@media(max-width:520px){.view{padding:16px 15px 40px}.topbar{margin:-16px -15px 23px;padding:12px 15px}.hero{padding:28px 23px;margin:12px 0 24px;border-radius:21px}.hero:after{right:-95px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:180px;padding:14px 12px;border-radius:16px;gap:9px}.card h3{font-size:.91rem;max-width:78%}.game-art{font-size:2.5rem;right:10px;top:35px}.game-hero{min-height:164px;padding:22px 19px;border-radius:18px;gap:8px}.game-hero-copy{max-width:76%}.game-art-large{width:86px;height:86px;border-radius:25px;font-size:3.4rem}.game-hero:before{width:110px;height:110px;right:0}.game-hero:after{width:148px;height:148px;right:-8%}.card .num{font-size:.61rem}.chip{font-size:.64rem;padding:4px 7px}.live{font-size:.59rem}.prow{grid-template-columns:32px minmax(0,1fr) 64px 46px 32px;gap:6px;padding:9px 8px}.rank{width:30px;height:30px}.ptotal{font-size:.96rem}.idel{padding:5px;min-height:36px}.rules{padding:20px 17px}}
@media(max-width:360px){.view{padding-left:12px;padding-right:12px}.topbar{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}.grid{grid-template-columns:1fr}.card{min-height:156px}.prow{grid-template-columns:28px minmax(0,1fr) 58px 40px 30px;gap:5px;padding:8px 6px}.pname{font-size:.85rem}.rinp{font-size:.93rem}.ptotal{font-size:.88rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- VISTA 1: CATÁLOGO -->
<section id="v-catalog" class="view active">
  <header class="hero">
    <p class="eyebrow">La mesa está lista</p>
    <h1 class="app">Dominó, a tu manera.</h1>
    <p class="sub">Elige tu juego, invita a la gente y deja que el marcador lleve las cuentas. Todo listo para la próxima ronda.</p>
  </header>
  <div class="section-heading"><h2>Elige una partida</h2><span>11 juegos para compartir</span></div>
  <div class="grid" id="grid"></div>
</section>

<!-- VISTA 2: REGLAS -->
<section id="v-rules" class="view game-themed">
  <div class="topbar">
    <button class="back" id="backRules">← Volver</button>
    <strong>Reglas del juego</strong>
  </div>
  <header class="game-hero">
    <div class="game-hero-copy">
      <span class="game-kicker" id="gameKicker"></span>
      <h2 class="title" id="rTitle"></h2>
      <p class="meta" id="rMeta"></p>
    </div>
    <div class="game-art-large" id="gameArt" aria-hidden="true"></div>
  </header>
  <div class="rules" id="rBody"></div>
  <button class="btn primary" id="btnStart">▶ Iniciar Juego</button>
</section>

<!-- VISTA 3: MARCADOR -->
<section id="v-score" class="view">
  <div class="topbar">
    <button class="back" id="backScore">← Volver</button>
    <div class="game-score-title"><span class="score-game-icon" id="scoreGameIcon" aria-hidden="true"></span><strong id="sTitle"></strong></div>
  </div>
  <div class="sets" id="sets"></div>
  <div class="roundinfo"><span id="roundNum"></span><span id="setLabel"></span></div>
  <div id="joinNote" class="joinnote" style="display:none"></div>
  <div class="addrow">
    <input type="text" id="newName" placeholder="Nombre del jugador…" maxlength="20">
    <button class="addbtn" id="btnAdd">+</button>
  </div>
  <div id="players"></div>
  <div class="actions">
    <button class="btn green" id="btnSaveRound">✓ Guardar Ronda / Siguiente Ronda</button>
    <button class="btn ghost" id="btnUndo">↩ Borrar Ronda Anterior</button>
    <button class="btn red" id="btnReset">✕ Eliminar / Reiniciar Partida</button>
  </div>
  <p class="hist" id="histInfo"></p>
</section>

<script>
/* ============ DATOS DE LOS 11 JUEGOS ============ */
const GAMES = [
{id:'tren', name:'Tren Mexicano', min:2, max:8, sets:[12,9], playersLabel:'2 - 8 jugadores', setLabel:'Set Doble-12 (o Doble-9)',
rules:`<h3>🎯 Objetivo</h3>
<p>Ser el primero en quedarse sin fichas en cada ronda y terminar la noche con la <b>menor cantidad de puntos</b> acumulados.</p>
<h3>🃏 Preparación</h3>
<ul>
<li>Revuelve todas las fichas boca abajo. Con <b>Doble-12</b>: reparte <b>15 fichas</b> cada uno (2-4 jug.), <b>12 fichas</b> (5-6 jug.) o <b>10 fichas</b> (7-8 jug.). Con <b>Doble-9</b>: 10 fichas cada uno.</li>
<li>Las fichas sobrantes forman el <b>pozo</b> (pueden robarse).</li>
<li>El jugador con el <b>doble más alto</b> inicia: lo coloca al centro y abre el Tren Mexicano (la línea pública). Cada jugador abre su <b>tren personal</b> saliendo del doble.</li>
</ul>
<h3>🔄 Desarrollo por turnos</h3>
<ul>
<li>En tu turno debes colocar una ficha que <b>embona</b> en tu tren, en el tren de otro jugador <b>abierto</b>, o en el Tren Mexicano.</li>
<li>Si no puedes jugar, <b>roba una ficha del pozo</b>: si sirve, juegas; si no, colocas un marcador y tu tren queda <b>abierto</b> (cualquiera puede jugar en él). El Tren Mexicano nunca puede cerrarse.</li>
<li>Puedes abrir tu tren voluntariamente jugando fuera de turno… solo si es legal tu jugada (usa el Tren Mexicano si está bloqueado).</li>
</ul>
<h3>🏆 Puntuación y victoria</h3>
<ul>
<li>La ronda termina cuando un jugador se <b>descarta</b> (se queda sin fichas).</li>
<li>Los demás <b>suman los puntos (pipas) de sus fichas restantes</b> y los anotan como puntos en contra.</li>
<li>Se juegan rondas hasta un total acordado (típicamente 100 o 150 puntos). <b>Gana quien tenga MENOS puntos acumulados.</b></li>
</ul>`},

{id:'chicken', name:'Chicken Foot (Pata de Pollo)', min:2, max:8, sets:[9,12], playersLabel:'2 - 8 jugadores', setLabel:'Set Doble-9 o Doble-12',
rules:`<h3>🎯 Objetivo</h3>
<p>Quedarte sin fichas en cada ronda y acumular la <b>menor cantidad de puntos</b> al final de la partida.</p>
<h3>🃏 Preparación</h3>
<ul>
<li>Reparte <b>7 fichas</b> a cada jugador; el resto forma el pozo.</li>
<li>Comienza quien tenga el <b>doble más alto</b> del set (doble-9 o doble-12) y lo coloca al centro.</li>
<li>Se juega en sentido de las agujas del reloj.</li>
</ul>
<h3>🔄 Desarrollo por turnos</h3>
<ul>
<li>Debes jugar una ficha que <b>embone por número</b> en cualquier cadena abierta.</li>
<li>⚠️ Regla clave: cuando alguien juega un <b>doble</b>, la jugada siguiente <b>debe responder a ese doble</b>… y las tres jugadas siguientes deben colocarse sobre él, formando la <b>pata de pollo</b> (3 fichas). Nadie puede jugar en otro lado hasta completar la pata.</li>
<li>Si no puedes jugar, roba del pozo hasta poder jugar o hasta agotarlo; entonces pasas.</li>
</ul>
<h3>🏆 Puntuación y victoria</h3>
<ul>
<li>Cuando alguien se queda sin fichas, la ronda acaba. Los demás suman las <b>pipas de sus fichas</b> en contra.</li>
<li>Al total acordado de puntos, <b>gana el jugador con menos puntos acumulados</b>.</li>
</ul>`},

{id:'texas42', name:'Texas 42', min:4, max:4, sets:[6], playersLabel:'4 jugadores (2 parejas)', setLabel:'Set Doble-6 (28 fichas)',
rules:`<h3>🎯 Objetivo</h3>
<p>Juego de <b>bazas y subasta</b> para 4 jugadores en 2 parejas enfrentadas. Las 28 fichas del doble-6 actúan como baraja: cada número (0-6) es un <b>palo</b> y cada ficha pertenece a los palos de sus dos extremos.</p>
<h3>🃏 Preparación</h3>
<ul>
<li>Reparte <b>7 fichas</b> a cada jugador.</li>
<li>Se realiza una <b>subasta</b> de 30 a 42: la pareja ganadora se compromete a capturar al menos esa cantidad de puntos en bazas y elige el <b>triunfo</b> (un número 0-6 o los dobles).</li>
<li>Existe la subasta nula ("<i>nello</i>"): apostar a no ganar ninguna baza.</li>
</ul>
<h3>🔄 Desarrollo por turnos</h3>
<ul>
<li>El ganador de la subasta inicia la primera baza; luego gana la baza quien jugó la ficha más alta del <b>palo de salida</b> (las fichas con ese número en un extremo son del palo). Gana la baza el del palo triunfo más alto si hubo triunfo.</li>
<li><b>Debes seguir palo</b> si puedes; si no, puedes descartar o cortar con triunfo.</li>
</ul>
<h3>🏆 Puntuación y victoria</h3>
<ul>
<li>Cada baza vale puntos por sus <b>fichas de cuenta</b> (pipas): las que suman 5 o 10 (0-5, 1-4, 2-3 = 5 pts c/u; 5-5 y 4-6 = 10 pts c/u), total 35, <b>más 1 punto por baza ganada = 42 puntos en total</b>.</li>
<li>Si la pareja que ganó la subasta cumple su contrato, anota las <b>marcas</b> pujadas; si falla, las anota la pareja rival. La partida suele jugarse a 7 marcas (¡una partida "de 42"!).</li>
</ul>`},

{id:'muggins', name:'Muggins (All Fives / Todo Cincos)', min:2, max:4, sets:[6], playersLabel:'2 - 4 jugadores', setLabel:'Set Doble-6',
rules:`<h3>🎯 Objetivo</h3>
<p>Embonar fichas normalmente, pero puntuando cada vez que las <b>dos puntas abiertas sumen múltiplo de 5</b>. Gana quien llegue primero al total acordado (100 pts clásico).</p>
<h3>🃏 Preparación</h3>
<ul>
<li>Reparte <b>5 fichas</b> a cada jugador; el resto es el pozo.</li>
<li>Comienza quien tenga el doble más alto (o la ficha más alta si no hay dobles).</li>
</ul>
<h3>🔄 Desarrollo por turnos</h3>
<ul>
<li>Coloca fichas <b>embonando por igual</b> como en el dominó clásico.</li>
<li>Tras cada jugada, <b>si la suma de las dos puntas abiertas es 5, 10, 15 o 20, anota esa cantidad</b> (un doble recién jugado cuenta sus dos lados).</li>
<li>Si no puedes jugar, roba del pozo hasta poder jugar; si el pozo se acaba, pasas.</li>
<li>¡Ojo! Si puntuas y <b>no lo anuncias</b>, cualquier rival puede gritar <b>"¡Muggins!"</b> y robarse esos puntos.</li>
</ul>
<h3>🏆 Puntuación y victoria</h3>
<ul>
<li>Puntos por múltiplos de 5 durante la ronda, más: cuando alguien se descarta, los rivales suman las pipas de sus fichas restantes <b>redondeadas al múltiplo de 5 más cercano</b>… y esa cantidad la anota el ganador de la ronda.</li>
<li>Gana el primero en llegar al puntaje acordado.</li>
</ul>`},

{id:'matador', name:'Matador', min:2, max:4, sets:[6], playersLabel:'2 - 4 jugadores', setLabel:'Set Doble-6',
rules:`<h3>🎯 Objetivo</h3>

const GAME_THEMES = {
  tren: { icon:'🚂', kicker:'A toda máquina' },
  chicken: { icon:'🐔', kicker:'¡Pata de pollo!' },
  texas42: { icon:'🤠', kicker:'Bazas y estrategia' },
  muggins: { icon:'5️⃣', kicker:'¡Que sumen cinco!' },
  matador: { icon:'🐂', kicker:'Embona a tu manera' },
  bergen: { icon:'🏔️', kicker:'El reto de los dobles' },
  escalera: { icon:'🪜', kicker:'Escalón a escalón' },
  faro: { icon:'🗼', kicker:'Que se haga la luz' },
  chipote: { icon:'🀄', kicker:'Roba, combina y baja' },
  culebra: { icon:'🐍', kicker:'La cadena no para' },
  cruzada: { icon:'🤝', kicker:'Jueguen en equipo' }
};

/* ============ NAVEGACIÓN SPA ============ */
const $ = s => document.querySelector(s);
let currentGame = null;
function applyGameTheme(element, id){
  element.dataset.game = id;
}
function show(id){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('#'+id).classList.add('active');
  window.scrollTo(0,0);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storeKey = id => 'dmx_state_' + id;
const hasGame = id => { try { const s = JSON.parse(localStorage.getItem(storeKey(id))); return s && s.players.length > 0; } catch(e){ return false; } };

/* ---- Vista 1: Catálogo ---- */
function renderCatalog(){
  $('#grid').innerHTML = GAMES.map((g,i) => `
    <button class="card" type="button" data-id="${g.id}" aria-label="Ver reglas de ${g.name}">
      <span class="num">JUEGO ${String(i+1).padStart(2,'0')}</span>
      <span class="game-art" aria-hidden="true">${GAME_THEMES[g.id].icon}</span>
      <h3>${g.name}</h3>
      ${hasGame(g.id) ? '<span class="live">● PARTIDA EN CURSO</span>' : ''}
      <span class="chip">${g.playersLabel}</span>
      <span class="chip">◈ ${g.setLabel}</span>
    </button>`).join('');
  document.querySelectorAll('.card').forEach(c =>
    c.addEventListener('click', () => openRules(c.dataset.id)));
}

/* ---- Vista 2: Reglas ---- */
function openRules(id){
  currentGame = GAMES.find(g => g.id === id);
  const theme = GAME_THEMES[id];
  applyGameTheme($('#v-rules'), id);
  $('#gameKicker').textContent = theme.kicker;
  $('#gameArt').textContent = theme.icon;
  $('#rTitle').textContent = currentGame.name;
  $('#rMeta').innerHTML = `Jugadores: <b>${currentGame.playersLabel}</b> &nbsp;·&nbsp; ◈ <b>${currentGame.setLabel}</b>`;
  $('#rBody').innerHTML = currentGame.rules;
  show('v-rules');
}
$('#backRules').addEventListener('click', () => show('v-catalog'));
$('#btnStart').addEventListener('click', () => openScore(currentGame.id));

/* ---- Vista 3: Marcador ---- */
let state = null; // {players:[{id,name,total,order}], rounds:[{pid:pts}], draft:{}, set, roundNo}

function openScore(id){
  currentGame = GAMES.find(g => g.id === id);
  applyGameTheme($('#v-score'), id);
  loadState();
  $('#scoreGameIcon').textContent = GAME_THEMES[id].icon;
  $('#sTitle').textContent = currentGame.name;
  renderSets(); renderScore();
  show('v-score');
}
function loadState(){
  try { state = JSON.parse(localStorage.getItem(storeKey(currentGame.id))); } catch(e){ state = null; }
  if (!state || state.players === undefined){
    state = { players: [], rounds: [], draft: {}, set: currentGame.sets[0], roundNo: 1 };
  }
}
function saveState(){ localStorage.setItem(storeKey(currentGame.id), JSON.stringify(state)); }

function renderSets(){
  $('#sets').innerHTML = [6,9,12].map(n =>
    `<button type="button" class="set ${state.set===n?'on':''} ${currentGame.sets.includes(n)?'':'off'}" data-set="${n}" ${currentGame.sets.includes(n)?'':'disabled'} aria-pressed="${state.set===n}">Doble-${n}</button>`).join('');
  document.querySelectorAll('.set').forEach(el => el.addEventListener('click', () => {
    const n = +el.dataset.set;
    if (!currentGame.sets.includes(n)) return;
    state.set = n; saveState(); renderSets(); renderScore();
  }));
  $('#setLabel').textContent = 'Set: Doble-' + state.set;
}

function sortedPlayers(){
  return [...state.players].sort((a,b) => a.total - b.total || a.order - b.order);
}
function renderScore(){
  const list = sortedPlayers();
  $('#players').innerHTML = list.length ? list.map((p, i) => `
    <div class="prow ${i===0?'first':''}">
      <span class="rank">${i+1}</span>
      <span class="pname">${esc(p.name)}</span>
      <input type="number" inputmode="numeric" min="0" class="rinp" data-id="${p.id}" value="${state.draft[p.id] || ''}" placeholder="+0" aria-label="Puntos de ${esc(p.name)} en esta ronda">
      <span class="ptotal">${p.total}</span>
      <button class="idel" type="button" data-id="${p.id}" title="Eliminar jugador" aria-label="Eliminar a ${esc(p.name)}">🗑</button>
    </div>`).join('')
    : '<p class="empty">Sin jugadores aún. Agrega a los participantes con el botón +</p>';

  document.querySelectorAll('.rinp').forEach(inp =>
    inp.addEventListener('input', () => { state.draft[inp.dataset.id] = inp.value; saveState(); }));
  document.querySelectorAll('.idel').forEach(btn =>
    btn.addEventListener('click', () => removePlayer(btn.dataset.id)));

  $('#roundNum').textContent = 'Ronda ' + state.roundNo;
  $('#histInfo').textContent = state.rounds.length
    ? 'Rondas registradas: ' + state.rounds.length
    : 'Aún no hay rondas registradas. Los puntos de la mesa no se suman hasta guardar la ronda.';

  const note = $('#joinNote');
  if (state.players.length > 0 && state.players.length < currentGame.max && state.players.some(p => p.total > 0)){
    const avg = Math.round(state.players.reduce((s,p) => s + p.total, 0) / state.players.length);
    note.style.display = 'block';
    note.textContent = '📊 Ingreso tardío: un nuevo jugador entraría con ' + avg + ' pts (promedio redondeado de los ' + state.players.length + ' activos).';
  } else note.style.display = 'none';
  $('#newName').placeholder = state.players.length >= currentGame.max
    ? 'Máximo ' + currentGame.max + ' jugadores' : 'Nombre del jugador…';
}

/* ---- Gestión de jugadores ---- */
$('#btnAdd').addEventListener('click', addPlayer);
$('#newName').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });
function addPlayer(){
  const name = $('#newName').value.trim();
  if (!name) return;
  if (state.players.length >= currentGame.max){ alert('Este juego admite máximo ' + currentGame.max + ' jugadores.'); return; }
  let initial = 0;
  if (state.players.length > 0){
    const sum = state.players.reduce((s,p) => s + p.total, 0);
    initial = Math.round(sum / state.players.length);
  }
  state.players.push({ id: Date.now() + '' + Math.floor(Math.random()*999), name, total: initial, order: state.players.length });
  $('#newName').value = '';
  saveState(); renderScore();
}
function removePlayer(id){
  const p = state.players.find(x => x.id === id);
  if (!p) return;
  if (!confirm('¿Eliminar a ' + p.name + '? Sus puntos se borrarán por completo.')) return;
  state.players = state.players.filter(x => x.id !== id);
  delete state.draft[id];
  saveState(); renderScore();
}

/* ---- Rondas ---- */
$('#btnSaveRound').addEventListener('click', () => {
  if (!state.players.length){ alert('Agrega al menos un jugador.'); return; }
  const round = {};
  let any = false;
  state.players.forEach(p => {
    const v = parseInt(state.draft[p.id]) || 0;
    if (v) any = true;
    round[p.id] = Math.max(0, v);
    p.total += Math.max(0, v);
  });
  state.rounds.push(round);
  state.draft = {};
  state.roundNo++;
  saveState(); renderScore();
});
$('#btnUndo').addEventListener('click', () => {
  if (!state.rounds.length){ alert('No hay rondas para deshacer.'); return; }
  const last = state.rounds.pop();
  state.players.forEach(p => { if (last[p.id]) p.total -= last[p.id]; });
  state.draft = {};
  state.roundNo = Math.max(1, state.roundNo - 1);
  saveState(); renderScore();
});
$('#btnReset').addEventListener('click', () => {
  if (!state.players.length && !state.rounds.length) return;
  if (!confirm('¿Eliminar TODA la partida? Se borrarán rondas y puntos de "' + currentGame.name + '".')) return;
  state = { players: [], rounds: [], draft: {}, set: currentGame.sets[0], roundNo: 1 };
  saveState(); renderSets(); renderScore();
});

/* ---- Volver con confirmación si hay puntos ---- */
$('#backScore').addEventListener('click', () => {
  const has = state.players.some(p => p.total > 0) || Object.keys(state.draft).length > 0;
  if (has && !confirm('Hay una partida en curso. ¿Volver al menú? (Los puntos se guardan automáticamente)')) return;
  show('v-catalog'); renderCatalog();
});

renderCatalog();
</script>
</body>
</html>
